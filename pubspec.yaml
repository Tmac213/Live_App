name: live_gift_app
description: A live streaming and virtual gifting Flutter app.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.4.0
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  zego_uikit_prebuilt_live_streaming: ^3.2.0
  cached_network_image: ^3.3.0
  json_annotation: ^4.8.0
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/gifts/
